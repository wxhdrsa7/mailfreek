name = "mailfreek"
# name = "mail-exhibit"
main = "src/server.js"
compatibility_date = "2024-01-01"
# 部署时保留 Cloudflare 控制台里已经设置好的环境变量，不会被这个文件覆盖
keep_vars = true

# D1 数据库绑定
[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "maill_free_db" #你的d1数据库名称
database_id = "a8dd02f5-d9df-49b2-a992-371f3609e6c5" # 你的database_id

# 环境变量
# 注意：JWT_TOKEN、ADMIN_PASSWORD、MAIL_DOMAIN、各发件渠道的 API Key 请继续在 Cloudflare 控制台设置，
# 不要写进这个文件（仓库是公开的）。
# V5.3.x 新增的可选发件渠道：RESEND_API_KEY / SENDFLARE_API_KEY / CYBERPERSONS_API_KEY
[vars]
# FORWARD_RULES="[{"prefix":"vip","email":"a@example.com"},{"prefix":"*","email":"2141083706@qq.com"}]"

# 静态资源目录（Workers + Assets）
[assets]
directory = "public"
# 显式指定绑定名，确保在 Worker 中通过 env.ASSETS 可用
binding = "ASSETS"

# R2 存储桶绑定（用于保存完整 EML 内容）
[[r2_buckets]]
binding = "MAIL_EML"
bucket_name = "mail-eml"

# wrangler.toml (wrangler v3.88.0^) 日志服务
# [observability.logs]
# enabled = true
